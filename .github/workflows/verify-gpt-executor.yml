name: Verify GPT Executor Architecture

on:
  pull_request:
    branches:
      - feature/control-room-mvp
  push:
    branches:
      - feature/gpt-executor-v1

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run test:unit
